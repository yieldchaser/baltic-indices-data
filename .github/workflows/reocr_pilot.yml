# Re-OCR pilot — LIVE 35-image run (Decision 2, muse-spark).
#
# Manual dispatch ONLY (no push/schedule triggers). Runs the reviewed harness
# scripts/pilot/reocr_pilot.py --venue auto over data/derived/pilot_image_set.jsonl
# with repo CI secrets mapped to the SAME env names the harness reads.
#
# Model/venue selection (recorded to choice.json with rationale):
#   1. NIM first IF its configured model is vision-capable (probe decides);
#   2. else Ollama vision (note: OLLAMA_MODEL=gemma3:4b returned HTTP 410
#      "retired 2026-07-15" in CI on 2026-09-06, so it must re-prove itself);
#   3. else OpenRouter vision (OPENROUTER_MODEL pinned to a vision model here
#      because the repo default is a text-only model);
#   4. else Groq vision (GROQ_MODEL pinned likewise).
# The preflight probe blanks the env of venues that fail the probe so that
# `--venue auto` resolves to the verified vision-capable venue.
#
# Hard caps: max 35 images; projected spend gate $25 (preflight); per-call
# timeout via PILOT_REQUEST_TIMEOUT_SEC; 429 abort via PILOT_ABORT_429;
# total-call budget PILOT_MAX_TOTAL_CALLS (= 140 - probe calls).
name: Re-OCR Pilot (live 35-image)

on:
  workflow_dispatch:

permissions:
  contents: read

run-name: reocr-pilot-live (${{ github.ref_name }})

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NIM_API_KEY }}
      NIM_MODEL: ${{ secrets.NIM_MODEL }}
      NIM_BASE_URL: ${{ secrets.NIM_BASE_URL }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pilot deps (requests, PIL only)
        run: pip install requests pillow

      - name: Preflight (set cap, spend gate, venue probe + selection)
        run: python3 scripts/pilot/ci_support.py preflight

      - name: Run live pilot (35 images, --venue auto)
        run: |
          python3 scripts/pilot/reocr_pilot.py --venue auto \
            --set data/derived/pilot_image_set.jsonl \
            --out data/derived/pilot_reocr_out \
            --max-images 35
        env:
          PILOT_REQUEST_TIMEOUT_SEC: '120'
          PILOT_MAX_RETRIES: '3'
          PILOT_REDO_LIMIT: '1'
          PILOT_MIN_INTERVAL_SEC: '1.5'
          PILOT_ABORT_429: '8'
          # PROBE_CALLS was exported by preflight via $GITHUB_ENV, so the
          # expression below resolves at step start: budget = 140 - probes.
          PILOT_MAX_TOTAL_CALLS: ${{ 140 - env.PROBE_CALLS }}

      - name: Build cost/latency accounting
        if: always()
        run: python3 scripts/pilot/ci_support.py account

      - name: Upload pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-reocr-live
          path: data/derived/pilot_reocr_out/
          if-no-files-found: error
